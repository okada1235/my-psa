<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSA提出カード管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  /* ==== 赤・白・黒 / 角ばった業務ツール ==== */
  :root{
    --red:#d1181f; --red-d:#9e0f14; --red-t:#fbe9e9;
    --black:#141414; --ink:#161616; --sub:#6d6d6d;
    --bg:#e8e8e8; --paper:#ffffff;
    --line:#141414; --line-2:#cccccc; --line-3:#e2e2e2;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",monospace;
    --num:"Helvetica Neue",Arial,"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.55;
    -webkit-text-size-adjust:100%;
  }
  a{color:inherit}
  ::selection{background:var(--red);color:#fff}
  /* ==== topbar（header+tabs+banner を一体でsticky） ==== */
  .topbar{position:sticky;top:0;z-index:40}
  header{background:var(--black);color:#fff;border-bottom:3px solid var(--red)}
  .head-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:13px 18px}
  .logo{
    width:40px;height:40px;flex:none;background:var(--red);
    display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px;
    letter-spacing:1px;font-family:var(--mono);
  }
  header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.06em}
  header .sub{font-size:11px;color:#9a9a9a;margin-top:2px;letter-spacing:.04em}
  .head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .save-pill{font-size:10.5px;color:#9a9a9a;display:flex;align-items:center;gap:6px;letter-spacing:.06em;text-transform:uppercase}
  .dot{width:8px;height:8px;background:var(--red)}
  /* ==== tabs ==== */
  .tabs{background:#1f1f1f;border-bottom:1px solid #000}
  .tabs-in{max-width:1200px;margin:0 auto;display:flex;gap:0;padding:0 10px;overflow-x:auto}
  .tab{
    background:none;border:none;border-right:1px solid #333;color:#b6b6b6;font-family:inherit;font-size:13px;font-weight:700;
    padding:11px 18px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;letter-spacing:.03em;
    border-bottom:3px solid transparent;transition:.1s;
  }
  .tab:hover{color:#fff;background:#2a2a2a}
  .tab.active{color:#fff;background:var(--red);border-bottom-color:#fff}
  .tab .cnt{font-size:11px;background:rgba(255,255,255,.16);padding:1px 7px;font-weight:800;font-family:var(--mono);min-width:20px;text-align:center}
  .tab.active .cnt{background:#fff;color:var(--red)}
  /* ==== banner（全提出の合計・常時表示） ==== */
  .banner{background:#000;color:#fff;border-bottom:2px solid var(--red)}
  .banner-in{max-width:1200px;margin:0 auto;display:flex;gap:0;padding:0 18px;overflow-x:auto}
  .b-item{display:flex;flex-direction:column;justify-content:center;padding:9px 20px 9px 0;margin-right:20px;border-right:1px solid #2b2b2b;min-width:130px}
  .b-item:last-child{border-right:none;margin-right:0}
  .b-k{font-size:10px;color:#9a9a9a;font-weight:700;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .b-k::before{content:"";width:9px;height:9px;background:var(--red);flex:none}
  .b-v{font-size:24px;font-weight:900;font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em;margin-top:3px}
  main{max-width:1200px;margin:0 auto;padding:20px 16px 80px}
  .view{display:none}
  .view.active{display:block}
  /* ==== panels ==== */
  .panel{background:var(--paper);border:1.5px solid var(--black);margin-bottom:18px}
  .panel-h{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1.5px solid var(--black);background:#fafafa}
  .panel-h .num{width:24px;height:24px;background:var(--red);color:#fff;font-weight:900;font-size:13px;display:grid;place-items:center;flex:none;font-family:var(--mono)}
  .panel-h h2{font-size:14px;margin:0;font-weight:800;letter-spacing:.04em}
  .panel-h .hint{font-size:11.5px;color:var(--sub);margin-left:auto;letter-spacing:.02em}
  .panel-b{padding:16px}
  /* ==== drop ==== */
  .drop{border:2px dashed #9a9a9a;padding:26px 18px;text-align:center;background:#f6f6f6;cursor:pointer;transition:.12s}
  .drop:hover,.drop.drag{border-color:var(--red);border-style:solid;background:var(--red-t)}
  .drop .big{font-size:15px;font-weight:800;letter-spacing:.02em}
  .drop .small{font-size:12px;color:var(--sub);margin-top:5px}
  .drop svg{width:34px;height:34px;color:var(--black);margin-bottom:6px}
  /* ==== buttons ==== */
  .btn{border:1.5px solid var(--black);background:#fff;color:var(--ink);padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.1s;font-family:inherit;white-space:nowrap;letter-spacing:.02em}
  .btn:hover{background:var(--black);color:#fff}
  .btn.gold{background:var(--red);border-color:var(--red);color:#fff}
  .btn.gold:hover{background:var(--red-d);border-color:var(--red-d);color:#fff}
  .btn.nav{background:transparent;border-color:#666;color:#fff}
  .btn.nav:hover{background:#fff;color:var(--black);border-color:#fff}
  .btn.ghost{background:#fff;border-color:var(--black)}
  .btn.danger{color:var(--red);border-color:var(--red);background:#fff}
  .btn.danger:hover{background:var(--red);color:#fff}
  .btn.sm{padding:6px 11px;font-size:12px}
  /* ==== fields ==== */
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  input,select{font-family:inherit;font-size:13px;padding:8px 9px;border:1.5px solid var(--line-2);background:#fff;color:var(--ink);width:100%;border-radius:0}
  input:focus,select:focus{outline:none;border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
  .ro{background:#f6f6f6;border:1.5px solid var(--line-2);padding:8px 11px}
  .ro .k{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .ro .v{font-size:18px;font-weight:900;margin-top:3px;font-family:var(--num);font-variant-numeric:tabular-nums}
  /* ==== table ==== */
  .tablewrap{overflow-x:auto;border:1.5px solid var(--black)}
  table{border-collapse:collapse;width:100%;min-width:880px;font-size:14px}
  thead th{background:var(--black);color:#fff;font-weight:700;font-size:12px;text-align:left;padding:10px 10px;white-space:nowrap;letter-spacing:.06em;text-transform:uppercase}
  tbody td{padding:6px 8px;border-bottom:1px solid var(--line-3);vertical-align:middle}
  tbody tr:nth-child(even){background:#f6f6f6}
  tbody tr:hover{background:var(--red-t)}
  td .seq{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:900;font-family:var(--num);font-size:14px}
  td input,td select{padding:6px 8px;font-size:14px}
  td .en{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.3}
  .col-name{min-width:240px}
  .spec{font-family:var(--mono);font-size:12px;color:var(--black);font-weight:700}
  .grade-sel{font-weight:900;color:var(--red);min-width:100px;font-size:14px}
  .grade-sel[data-g="未鑑定"]{color:var(--sub);font-weight:600}
  .num-in{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--num);font-weight:800}
  tfoot td{background:var(--black);color:#fff;font-weight:900;font-family:var(--num);font-variant-numeric:tabular-nums;font-size:16px;padding:11px 10px;border-top:2px solid var(--red)}
  tfoot .tlabel{text-transform:uppercase;letter-spacing:.06em;font-size:12px;font-family:inherit;font-weight:800}
  tfoot .money-red{color:#ff8a8f}
  .del{color:var(--red);border:1.5px solid transparent;background:none;cursor:pointer;font-size:15px;padding:2px 7px;line-height:1;font-weight:800}
  .del:hover{border-color:var(--red);background:var(--red);color:#fff}
  .badge{display:inline-block;background:var(--black);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;font-family:var(--mono);letter-spacing:.03em}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 11px;letter-spacing:.04em}
  .st.g{background:#fff;border:2px solid var(--red);color:var(--red)}
  .st.d{background:var(--black);color:#fff;border:2px solid var(--black)}
  /* ==== submission cards（横長の帯・縦積み） ==== */
  .sub-list{display:flex;flex-direction:column;gap:12px}
  .sub-card{background:var(--paper);border:1.5px solid var(--black);border-left:6px solid var(--red);padding:14px 18px;
    display:grid;grid-template-columns:200px 1fr auto;align-items:center;gap:22px}
  .sc-id{display:flex;flex-direction:column;gap:7px;align-items:flex-start}
  .sub-no{font-size:20px;font-weight:900;letter-spacing:.03em;font-family:var(--num);font-variant-numeric:tabular-nums;line-height:1.1}
  .sub-no small{display:block;font-size:10px;color:var(--sub);font-weight:800;margin-bottom:2px;letter-spacing:.1em;text-transform:uppercase;font-family:inherit}
  .sc-body{display:flex;flex-direction:column;gap:9px;min-width:0}
  .sub-meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13.5px;color:var(--sub)}
  .sub-meta b{color:var(--ink);font-weight:800}
  .sub-money{display:flex;flex-wrap:wrap;gap:0}
  .sm-item{padding:0 20px 0 0;margin-right:20px;border-right:1.5px solid var(--line-3)}
  .sm-item:last-child{border-right:none;margin-right:0;padding-right:0}
  .sm-k{font-size:10px;color:var(--sub);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
  .sm-v{font-size:19px;font-weight:900;font-family:var(--num);font-variant-numeric:tabular-nums;margin-top:1px}
  .grade-chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:12px;font-weight:800;padding:2px 9px;background:#fff;color:var(--black);border:1px solid var(--line-2);font-family:var(--num);font-variant-numeric:tabular-nums}
  .chip b{color:var(--red);margin-left:5px}
  .sub-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end;flex:none}
  .st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:4px 12px;letter-spacing:.04em}
  /* ==== empty / toast / foot ==== */
  .empty{text-align:center;padding:44px 20px;color:var(--sub);border:1.5px dashed var(--line-2);background:#fafafa}
  .empty .e-big{font-size:15px;font-weight:800;color:var(--ink)}
  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--black);color:#fff;padding:12px 18px;font-size:13px;font-weight:700;border-left:4px solid var(--red);opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:90vw;letter-spacing:.02em}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{text-align:center;color:var(--sub);font-size:11px;padding:12px;letter-spacing:.02em}
  @media(max-width:640px){
    header h1{font-size:15px}
    .head-actions .btn span.t{display:none}
    .sub-card{grid-template-columns:1fr;gap:12px}
    .sub-actions{justify-content:flex-start}
    .b-v{font-size:20px}
  }
</style>
</head>
<body>
<div class="topbar">
<header>
  <div class="head-in">
    <div class="logo">PSA</div>
    <div>
      <h1>PSA提出カード管理</h1>
      <div class="sub">提出用紙PDFの読み込み・翻訳・鑑定進捗の管理</div>
    </div>
    <div class="head-actions">
      <span class="save-pill" id="savePill"><span class="dot"></span>自動保存</span>
      <button class="btn nav" id="btnCsvIn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg><span class="t">CSV読込</span></button>
      <button class="btn nav" id="btnCsvOut"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0l-4 4m4-4l4 4M4 3h16"/></svg><span class="t">CSV書出</span></button>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-in">
    <button class="tab active" data-tab="editor">読込・編集</button>
    <button class="tab" data-tab="list">提出一覧 <span class="cnt" id="cntAll">0</span></button>
    <button class="tab" data-tab="grading">鑑定中 <span class="cnt" id="cntG">0</span></button>
    <button class="tab" data-tab="done">鑑定完了 <span class="cnt" id="cntD">0</span></button>
  </div>
</nav>

<div class="banner">
  <div class="banner-in">
    <div class="b-item"><span class="b-k">総仕入</span><span class="b-v" id="bCost">¥0</span></div>
    <div class="b-item"><span class="b-k">予想売却</span><span class="b-v" id="bExp">¥0</span></div>
    <div class="b-item"><span class="b-k">売却</span><span class="b-v" id="bAct">¥0</span></div>
  </div>
</div>
</div>

<main>
  <!-- ========== 編集ビュー ========== -->
  <div class="view active" id="view-editor">
    <section class="panel">
      <div class="panel-h"><span class="num">1</span><h2>提出用紙の読み込み</h2>
        <span class="hint">PSAの「Your submission is complete」PDFに対応</span></div>
      <div class="panel-b">
        <div class="drop" id="drop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2z"/><path d="M12 11v6m0 0l-2.5-2.5M12 17l2.5-2.5"/></svg>
          <div class="big">PDFをドロップ、またはクリックして選択</div>
          <div class="small">1提出＝1件として保存し、枚数に応じて1枚ずつ展開・日本語変換します</div>
        </div>
        <input type="file" id="pdfInput" accept="application/pdf" hidden>
        <input type="file" id="csvInput" accept=".csv,text/csv" hidden>
        <div id="loadMsg" style="margin-top:10px;font-size:12.5px;color:var(--sub)"></div>
      </div>
    </section>

    <section class="panel" id="infoPanel" style="display:none">
      <div class="panel-h"><span class="num">2</span><h2>提出情報</h2><span class="hint">提出者・ステータスはこの提出全体に適用</span></div>
      <div class="panel-b">
        <div class="info-grid">
          <div class="ro"><div class="k">提出番号</div><div class="v" id="iNo">—</div></div>
          <div class="field"><label>提出日（PDFのSUBMISSION DATE）</label><input type="date" id="iDate"></div>
          <div class="field"><label>サービスレベル</label><input type="text" id="iSvc"></div>
          <div class="field"><label>提出者（提出全体）</label><input list="staffList" id="iSubmitter" placeholder="提出者を選択・入力"></div>
          <div class="field"><label>ステータス</label>
            <select id="iStatus"><option>鑑定中</option><option>鑑定完了</option></select></div>
          <div class="ro"><div class="k">枚数</div><div class="v" id="iCount">0 枚</div></div>
        </div>
      </div>
    </section>

    <section class="panel" id="cardsPanel" style="display:none">
      <div class="panel-h"><span class="num">3</span><h2>カード一覧</h2>
        <span class="hint"><span id="countBadge" class="badge">0 枚</span></span></div>
      <div class="panel-b">
        <div id="tableArea"></div>
        <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <button class="btn sm ghost" id="btnAddRow">＋ 行を追加</button>
          <span style="display:inline-flex;align-items:center;gap:6px">
            <span style="font-size:12px;color:var(--sub)">グレード一括：</span>
            <select id="bulkGrade" style="width:auto"><option value="">—</option></select>
          </span>
          <button class="btn sm ghost" id="btnCsvOut2">この提出をCSV書出</button>
        </div>
      </div>
    </section>
  </div>

  <!-- ========== 提出一覧 ========== -->
  <div class="view" id="view-list">
    <div id="listArea"></div>
  </div>
  <!-- ========== 鑑定中 ========== -->
  <div class="view" id="view-grading">
    <div id="gradingArea"></div>
  </div>
  <!-- ========== 鑑定完了 ========== -->
  <div class="view" id="view-done">
    <div id="doneArea"></div>
  </div>

  <div class="foot">データはこのブラウザ内（localStorage）に自動保存されます。バックアップはCSV書出をご利用ください。</div>
</main>

<datalist id="staffList"></datalist>
<div id="toast"></div>

<script>
/* ============================================================
   PSA提出カード管理 v2 — 単一HTML・クライアント側のみ
   ============================================================ */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const STORE_KEY = "psa_submission_manager_v2";
const OLD_KEY   = "psa_submission_manager_v1";
const STAFF  = ["オカダ　ヒロト","サカイ ケンタ","テラサカ ダイキ","マナベ ナオヤ"];
const GRADES = ["PSA10","PSA9","PSA8","PSA7","PSA6","PSA5","PSA4","PSA3","PSA2","PSA1","オーソ/その他","未鑑定"];
const DEFAULT_GRADE = "PSA10";
const STATUSES = ["鑑定中","鑑定完了"];

let state = { submissions:[], editingId:null };
let activeTab = "editor";

/* ---------- 保存/読込 ---------- */
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); pulse(); }
  catch(e){ toast("保存に失敗しました（容量超過の可能性）"); } }
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ const s=JSON.parse(raw); state=Object.assign({submissions:[],editingId:null}, s); return; }
    migrateV1();
  }catch(e){ console.error(e); }
}
function migrateV1(){
  try{
    const raw = localStorage.getItem(OLD_KEY); if(!raw) return;
    const old = JSON.parse(raw); if(!old.cards || !old.cards.length) return;
    const m = old.meta||{};
    const sub = {
      id: newId("s"), submissionNo: m.submissionNo||"", date: toISO(m.date)||"",
      svcLevel: (m.svcLevel||"REGULAR"), submitter: (old.cards[0]&&old.cards[0].submitter)||"",
      status: "鑑定中", createdAt: Date.now(),
      cards: old.cards.map(c=>({ id:newId("c"), ln:c.ln||"", spec:c.spec||"",
        nameEn:c.nameEn||"", nameJa:c.nameJa||"", grade:(c.grade&&c.grade!=="未返却")?c.grade:DEFAULT_GRADE,
        cost:c.cost===undefined?"":c.cost, sellExp:"", sellAct:"" }))
    };
    state.submissions.push(sub); save();
    toast("以前のデータを1件の提出として引き継ぎました");
  }catch(e){}
}
let pulseT;
function pulse(){ const p=document.getElementById("savePill"); if(!p)return;
  p.style.color="#dfe6f5"; clearTimeout(pulseT); pulseT=setTimeout(()=>p.style.color="#b9c2da",600); }
function newId(pre){ return pre+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- トースト ---------- */
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2600); }

/* ============================================================
   翻訳（ルールベース。年・型番・番号は保持、編集可能）
   ============================================================ */
const PHRASES = [
  ["TAG TEAM GX ALL STARS","タッグチームGXオールスターズ"],
  ["ROCKET GANG STRIKES BACK","ロケット団の逆襲"],
  ["SKY-SPLITTING CHARISMA","裂空のカリスマ"],
  ["SKY- SPLITTING CHARISMA","裂空のカリスマ"],
  ["HOLON RESEARCH TOWER","ホロンの研究塔"],
  ["SUPER ELECTRIC BREAKER","超電ブレイカー"],
  ["GLORY OF TEAM ROCKET","ロケット団の栄光"],
  ["EMPERORS IN THE NEW WORLD","新たなる皇帝"],
  ["CARRYING ON HIS WILL","意志を受け継ぐ者"],
  ["THE TIME OF BATTLE","決闘の時"],
  ["ROUND1 PROMOTION PACK","ROUND1プロモパック"],
  ["PROMOTION PACK","プロモパック"],
  ["PROMO CARD PACK","プロモカードパック"],
  ["POKEMON CARD 151","ポケモンカード151"],
  ["POKEMON CARD FESTA","ポケモンカードフェスタ"],
  ["POKEMON CENTER","ポケモンセンター"],

function translate(en){
  if(!en) return "";
  let s = " "+en.toUpperCase().replace(/\s+/g," ").trim()+" ";
  s = s.replace(/([A-Z])-\s+([A-Z])/g,"$1-$2");
  for(const [a,b] of PHRASES){ s = s.split(a).join(b); }
  s = s.replace(/[A-Z][A-Z'&.]*[A-Z]|[A-Z]/g, (w)=>{
    const key = w.replace(/[^A-Z']/g,"");
    if(WORDS.hasOwnProperty(key)) return WORDS[key];
    return w;
  });
  s = s.replace(/\s+([&,])\s+/g,"$1").replace(/\s{2,}/g," ").trim();
  s = s.replace(/\s*\/\s*/g,"／");
  return s;
}

/* ============================================================
   PDF解析（検証済みロジック）
   ============================================================ */
async function pageLines(page){
  const tc = await page.getTextContent();
  const items = tc.items.filter(it=>it.str!=="").map(it=>({str:it.str,x:it.transform[4],y:it.transform[5],w:it.width||0}));
  const rows=[]; const tol=3;
  for(const it of items){
    let row = rows.find(r=>Math.abs(r.y-it.y)<=tol);
    if(!row){ row={y:it.y,items:[]}; rows.push(row); }
    row.items.push(it);
  }
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>{
    const its = r.items.sort((a,b)=>a.x-b.x); let out="";
    for(let k=0;k<its.length;k++){
      if(k>0){ const p=its[k-1]; if(its[k].x-(p.x+p.w) > 0.8) out+=" "; }
      out += its[k].str;
    }
    return out.replace(/\s+/g," ").trim();
  });
}
const ANCHOR = /^(\d+)\s+(\d+)\s+([A-Z]{2,3})\s*(\d{6,8})\s+TCG CARDS\s*(.*)$/;
const MONEY = /\$[\d,]+/;
const BADLINE = /LN ?#|SUBMISSION|CUSTOMER|GRAND TOTAL|Your submission|psacard|SERVICE LEVEL|PAYMENT|ORDER DETAILS|DESCRIPTION|VALUE TOTAL/;

async function parsePDF(arrayBuffer){
  const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  const records = {}; const meta = {}; let allText = "";
  for(let p=1;p<=pdf.numPages;p++){
    const page = await pdf.getPage(p);
    const lines = await pageLines(page);
    allText += "\n"+lines.join("\n");
    for(let i=0;i<lines.length;i++){
      const m = lines[i].match(ANCHOR); if(!m) continue;
      const ln=+m[1], qty=+m[2], spec=m[3]+m[4];
      let rest=m[5]||""; const mm=rest.match(MONEY);
      const inline=rest.replace(MONEY,"").trim();
      let desc;
      if(inline.length>3){ desc=inline; }
      else{
        const prev=i>0?lines[i-1]:""; const next=i+1<lines.length?lines[i+1]:"";
        desc = ((BADLINE.test(prev)?"":prev)+" "+(BADLINE.test(next)?"":next)).replace(/\s+/g," ").trim();
      }
      if(!records[ln]) records[ln]={ln,qty,spec,desc};
    }
  }
  const g = (re)=>{ const mm=allText.match(re); return mm?mm[1].trim():""; };
  meta.submissionNo = g(/SUBMISSION #\s*([0-9]{6,})/);
  // 提出日はラベルと別列に来るため、「SUBMISSION DATE」以降で最初に現れる M/D/YY を採用
  const dIdx = allText.indexOf("SUBMISSION DATE");
  const dM = dIdx>=0 ? allText.slice(dIdx).match(/(\d{1,2}\/\d{1,2}\/\d{2,4})/) : null;
  meta.date = dM ? dM[1] : "";
  meta.svcLevel = g(/SERVICE LEVEL:\s*([A-Z]+)/) || "REGULAR";
  const arr = Object.values(records).sort((a,b)=>a.ln-b.ln);
  return {records:arr, meta};
}
function toISO(us){
  if(!us) return "";
  const m = String(us).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(!m) return "";
  let [_,mm,dd,yy]=m; yy=yy.length===2?("20"+yy):yy;
  return `${yy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`;
}
/* PDF → 提出オブジェクト（1枚ずつ展開） */
function buildSubmission(records, meta){
  const cards=[];
  for(const r of records){
    for(let k=0;k<r.qty;k++){
      cards.push({ id:newId("c"), ln:r.ln, spec:r.spec, nameEn:r.desc, nameJa:translate(r.desc), grade:DEFAULT_GRADE, cost:"", sellExp:"", sellAct:"" });
    }
  }
  return { id:newId("s"), submissionNo:meta.submissionNo||"", date:toISO(meta.date)||"",
    svcLevel:meta.svcLevel||"REGULAR", submitter:"", status:"鑑定中", createdAt:Date.now(), cards };
}

function num(v){ return v===""||v==null?0:(+v||0); }
function moneySum(cards){
  return cards.reduce((a,c)=>{ a.cost+=num(c.cost); a.exp+=num(c.sellExp); a.act+=num(c.sellAct); return a; },
    {cost:0,exp:0,act:0});
}
function globalMoney(){
  return state.submissions.reduce((a,s)=>{ const m=moneySum(s.cards);
    a.cost+=m.cost; a.exp+=m.exp; a.act+=m.act; return a; }, {cost:0,exp:0,act:0});
}

   CSV
   ============================================================ */
const CSV_COLS=[
  ["submissionNo","提出番号"],["date","提出日"],["svcLevel","サービスレベル"],
  ["submitter","提出者"],["status","ステータス"],["seq","連番"],
  ["ln","LN"],["spec","SPEC"],["nameJa","カード名"],["nameEn","原文"],
  ["grade","グレード"],["cost","仕入金額(円)"],["sellExp","予想売却値(円)"],["sellAct","売却値(円)"]
];
function csvCell(v){ v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function todayStr(){ const d=new Date(); return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
function exportSubmissionCSV(sub){
  if(!sub||!sub.cards.length){ toast("書き出すカードがありません"); return; }
  const head=CSV_COLS.map(c=>c[1]).join(",");
  const lines=sub.cards.map((c,i)=>CSV_COLS.map(([k])=>{
    if(k==="seq") return i+1;
    if(["submissionNo","date","svcLevel","submitter","status"].includes(k)) return csvCell(sub[k]);
    return csvCell(c[k]);
  }).join(","));
  const csv="\uFEFF"+[head,...lines].join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`psa_${sub.submissionNo||"submission"}_${todayStr()}.csv`; a.click();
  URL.revokeObjectURL(a.href); toast("CSVを書き出しました");
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,"");
  const rows=[]; let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else{ if(ch=='"')q=true; else if(ch==",") {row.push(cur);cur="";}
      else if(ch=="\n"){ row.push(cur); rows.push(row); row=[];cur=""; }
      else if(ch=="\r"){} else cur+=ch; }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==""));
}
function importCSV(text){
  const rows=parseCSV(text);
  if(rows.length<2){ toast("CSVにデータがありません"); return; }
  const head=rows[0].map(h=>h.trim());
  const idx={}; CSV_COLS.forEach(([k,label])=>{ const i=head.indexOf(label); if(i>=0) idx[k]=i; });
  const get=(row,k)=> idx[k]!=null? (row[idx[k]]||"").trim() : "";
  // 提出番号でグループ化
  const groups={};
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; const no=get(row,"submissionNo")||"（番号なし）";
    (groups[no]=groups[no]||[]).push(row);
  }
  let added=0;
  Object.keys(groups).forEach(no=>{
    const grp=groups[no]; const first=grp[0];
    const numc=(row,k)=>get(row,k)===""?"":(+get(row,k)||0);
    const cards=grp.map(row=>({ id:newId("c"), ln:get(row,"ln"), spec:get(row,"spec"),
      nameJa:get(row,"nameJa"), nameEn:get(row,"nameEn"),
      grade:get(row,"grade")||DEFAULT_GRADE, cost:numc(row,"cost"),
      sellExp:numc(row,"sellExp"), sellAct:numc(row,"sellAct") }));
    const sub={ id:newId("s"), submissionNo:(no==="（番号なし）"?"":no), date:get(first,"date"),
      svcLevel:get(first,"svcLevel")||"REGULAR", submitter:get(first,"submitter"),
      status:get(first,"status")||"鑑定中", createdAt:Date.now(), cards };
    const exIdx=state.submissions.findIndex(s=>s.submissionNo && s.submissionNo===sub.submissionNo);
    if(exIdx>=0 && sub.submissionNo){
      if(confirm(`提出 ${sub.submissionNo} は既にあります。CSVの内容で置き換えますか？\n（キャンセルで別件として追加）`)){
        sub.id=state.submissions[exIdx].id; state.submissions[exIdx]=sub;
      }else state.submissions.push(sub);
    }else state.submissions.push(sub);
    added++;
  });
  save(); updateCounts(); renderLists();
  toast(`${added} 件の提出を読み込みました`);
  switchTab("list");
}

/* ============================================================
   PDF読み込み
   ============================================================ */
async function handlePDF(file){
  const msg=document.getElementById("loadMsg");
  if(file.type && file.type!=="application/pdf" && !file.name.toLowerCase().endsWith(".pdf")){
    msg.textContent="PDFファイルを選んでください。"; return;
  }
  msg.textContent="読み込み中…";
  try{
    const buf=await file.arrayBuffer();
    const {records,meta}=await parsePDF(buf);
    if(!records.length){ msg.innerHTML='<span style="color:var(--warn)">カード行が見つかりませんでした。PSAの提出完了PDFかご確認ください。</span>'; return; }
    const sub=buildSubmission(records,meta);
    // 同じ提出番号が既にある場合は確認
    const exIdx = sub.submissionNo? state.submissions.findIndex(s=>s.submissionNo===sub.submissionNo) : -1;
    if(exIdx>=0){
      if(confirm(`提出 ${sub.submissionNo} は既に保存されています。\n「OK」で置き換え、「キャンセル」で別件として追加します。`)){
        sub.id=state.submissions[exIdx].id; sub.status=state.submissions[exIdx].status; state.submissions[exIdx]=sub;
      }else state.submissions.push(sub);
    }else state.submissions.push(sub);
    state.editingId=sub.id;
    save(); updateCounts(); renderEditor();
    msg.innerHTML=`<span style="color:var(--ok)">✓ ${records.length} 行 → ${sub.cards.length} 枚を保存しました（提出番号 ${sub.submissionNo||"—"}）。下で編集できます。</span>`;
  }catch(err){ console.error(err);
    msg.innerHTML='<span style="color:var(--warn)">読み込みに失敗しました：'+esc(err.message||err)+'</span>'; }
}

/* ============================================================
   イベント配線
   ============================================================ */
// タブ
document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>switchTab(t.dataset.tab)));
// ドロップ
const drop=document.getElementById("drop");
const pdfInput=document.getElementById("pdfInput");
const csvInput=document.getElementById("csvInput");
drop.addEventListener("click",()=>pdfInput.click());
["dragenter","dragover"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("drag");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("drag");}));
drop.addEventListener("drop",e=>{ const f=e.dataTransfer.files[0]; if(f) handlePDF(f); });
pdfInput.addEventListener("change",e=>{ const f=e.target.files[0]; if(f) handlePDF(f); pdfInput.value=""; });
csvInput.addEventListener("change",e=>{ const f=e.target.files[0]; if(f){ const rd=new FileReader(); rd.onload=()=>importCSV(rd.result); rd.readAsText(f,"utf-8"); } csvInput.value=""; });

// 提出情報の編集
function bindInfo(id,key,after){
  document.getElementById(id).addEventListener("input",e=>{
    const sub=getEditing(); if(!sub) return;
    sub[key]=e.target.value; save(); if(after) after(sub);
  });
}
bindInfo("iDate","date");
bindInfo("iSvc","svcLevel");
bindInfo("iSubmitter","submitter");
document.getElementById("iStatus").addEventListener("change",e=>{
  const sub=getEditing(); if(!sub) return;
  sub.status=e.target.value; save(); updateCounts();
});

// ヘッダーCSV
document.getElementById("btnCsvIn").addEventListener("click",()=>csvInput.click());
document.getElementById("btnCsvOut").addEventListener("click",()=>{
  const sub=getEditing();
  if(!sub){ toast("編集中の提出がありません（一覧から開いてください）"); return; }
  exportSubmissionCSV(sub);
});
document.getElementById("btnCsvOut2").addEventListener("click",()=>{ const sub=getEditing(); if(sub) exportSubmissionCSV(sub); });

// 行追加・グレード一括
document.getElementById("btnAddRow").addEventListener("click",()=>{
  const sub=getEditing(); if(!sub){ toast("先にPDFを読み込んでください"); return; }
  sub.cards.push({ id:newId("c"), ln:"", spec:"", nameEn:"", nameJa:"", grade:DEFAULT_GRADE, cost:"", sellExp:"", sellAct:"" });
  renderEditor(); save(); updateCounts();
});
(function initBulk(){
  const sel=document.getElementById("bulkGrade");
  GRADES.forEach(g=>{ const o=document.createElement("option"); o.value=g; o.textContent="全て "+g; sel.appendChild(o); });
  sel.addEventListener("change",()=>{
    const sub=getEditing(); const g=sel.value;
    if(!sub||!g){ sel.value=""; return; }
    if(confirm(`この提出の ${sub.cards.length} 枚すべてのグレードを「${g}」にします。よろしいですか？`)){
      sub.cards.forEach(c=>c.grade=g); renderEditor(); save(); updateCounts(); toast("グレードを一括変更しました");
    }
    sel.value="";
  });
})();

/* 起動 */
(function boot(){
  // datalist（提出者候補）
  const dl=document.getElementById("staffList");
  STAFF.forEach(s=>{ const o=document.createElement("option"); o.value=s; dl.appendChild(o); });
  load(); updateCounts(); refreshBanner(); renderEditor(); renderLists();
})();
</script>
